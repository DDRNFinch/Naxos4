<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><meta name="description" content="Naxos 20 evidence capture app"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><title>Naxos 20</title></head>
<body><header class="app-header"><button id="back" class="back" hidden aria-label="Back">‹</button><div><h1>Naxos 20</h1><p id="header-sub">Choose a course</p></div><button id="install" hidden>Install</button></header><main id="app"></main><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
<script src="courses.js?v=20"></script><script src="prompts.js?v=20"></script><script>
const app=document.getElementById('app'),back=document.getElementById('back'),headerSub=document.getElementById('header-sub'),cameraInput=document.getElementById('cameraInput');let route={page:'home',course:null,unit:null,photo:null},deferredPrompt;const PHOTO_LABELS=['Prep','Start','During','Finish','Checks','Extras'];const colIndex={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8};
const UNIT_TITLES={'bricklayer-st0095':['Jointing Styles','Cavity Wall Setting Out','Cavity Wall Construction','Lintels and Soldiers','Sills and Cavity Closures','Insulation and Fire Stopping','Cavity Trays, DPCs and Weep Holes','Solid Walling and Capping','Brickwork Repair and Defects','Raking Cuts'],'architectural-joiner-st0264':['Basic Woodworking Joints','Timber Window Manufacture','First Fix Straight Staircases','First Fix Door Frames and Linings','Second Fix Timber Doors','Second Fix Wall and Floor Units','Timber Mouldings and Finishing','Staircase Spindles and Balustrades','Ironmongery','Fixed Machinery'],'site-carpenter-st0264':['Structural Carcassing','Partition Walls and Timber Sizing','Floor Joists and Coverings','Straight Flight Stairs','Service Encasements','Cladding','Wall and Floor Units','Handrails and Spindles','Internal and External Doors','Skirting and Architraves','Window Boards','Roof Carpentry']};
function esc(v){return String(v??'').replace(/[&<>\\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]));}
function mapping(unit,key){if(!unit)return '';if(Array.isArray(unit))return unit[colIndex[key]]||'';return unit[key]||unit[key.toLowerCase()]||''}
function unitTitle(c,u,i){return UNIT_TITLES[c.id]?.[i]||u[0]}
function keyFor(c,u){return 'naxos4:'+c.id+':'+u[0]}
function load(c,u){try{return JSON.parse(localStorage.getItem(keyFor(c,u))||'{}')}catch{return {}}}
function save(c,u,d){localStorage.setItem(keyFor(c,u),JSON.stringify(d))}
function courseById(id){return window.NAXOS4_COURSES.find(c=>c.id===id)}function unitByIndex(c,i){return c.units[i]}
function setHeader(t,s){document.querySelector('.app-header h1').textContent=t;headerSub.textContent=s||'';back.hidden=route.page==='home'}
function nav(p,c=null,u=null){route={page:p,course:c,unit:u,photo:null};render()}
function render(){if(route.page==='home')renderHome();if(route.page==='units')renderUnits();if(route.page==='photos')renderPhotos();if(route.page==='support')renderSupport();if(route.page==='audio')renderAudio()}
function renderHome(){setHeader('Naxos 20','Choose a course');app.innerHTML=`<section class="home"><div class="hero"><h2>Courses</h2><p>Select a course to view its units.</p></div><div class="course-tabs">${window.NAXOS4_COURSES.map(c=>`<button class="course-tab" data-course="${esc(c.id)}"><strong>${esc(c.title)}</strong><span>${esc(c.standard)} · v${esc(c.version)}</span><small>${c.units.length} units</small></button>`).join('')}</div></section>`;document.querySelectorAll('.course-tab').forEach(b=>b.onclick=()=>nav('units',courseById(b.dataset.course)))}
function renderUnits(){const c=route.course;setHeader(c.title,`${c.standard} · v${c.version}`);app.innerHTML=`<section class="page"><div class="page-heading"><h2>Units</h2><p>Select a unit to begin the evidence capture.</p></div><div class="unit-list">${c.units.map((u,i)=>{const d=load(c,u),t=unitTitle(c,u,i);return `<button class="unit-card" data-unit="${i}"><span class="unit-number">${i+1}</span><span class="unit-copy"><strong>${esc(t)}</strong><small>${esc(u[0])}</small><small>${d.finished?'Completed':'6 photos · statement · supporting evidence · audio'}</small></span><span class="chevron">›</span></button>`}).join('')}</div></section>`;document.querySelectorAll('.unit-card').forEach(b=>b.onclick=()=>nav('photos',c,unitByIndex(c,Number(b.dataset.unit))))}
function photoBox(i,data,prompt){const src=data.photos?.[i];return `<button class="photo-box ${src?'has-photo':''}" data-photo="${i}" aria-label="${PHOTO_LABELS[i]} photo">${src?`<img src="${src}" alt="${PHOTO_LABELS[i]} evidence photo"><span class="photo-retake">Retake</span>`:`<span class="photo-number">${i+1}</span><strong>${PHOTO_LABELS[i]}</strong><small>${esc(prompt)}</small>`}</button>`}
function renderPhotos(){const c=route.course,u=route.unit,d=load(c,u),t=unitTitle(c,u,c.units.indexOf(u)),prompt=window.NAXOS4_PROMPTS.photo(mapping(u,'A'),t,'A');setHeader(t,`${c.title} · Photo evidence`);app.innerHTML=`<section class="page evidence-page"><div class="page-heading"><p class="step">STEP 1 OF 3</p><h2>${esc(t)}</h2><p>Capture the work from preparation through to completion.</p></div><div class="photo-guidance"><strong>What to show</strong><p>${esc(prompt)}</p></div><div class="photo-grid">${PHOTO_LABELS.map((_,i)=>photoBox(i,d,prompt)).join('')}</div><label class="field-label" for="statement">Your statement</label><p class="criterion-prompt">Explain what you did, how you completed the work and how you checked the finished result.</p><textarea id="statement" class="text-input" placeholder="Tell us what you did and how you completed the work...">${esc(d.statement||'')}</textarea><button id="nextPhotos" class="primary">Next <span>›</span></button></section>`;document.querySelectorAll('.photo-box').forEach(x=>x.onclick=()=>{route.photo=Number(x.dataset.photo);cameraInput.value='';cameraInput.click()});document.getElementById('statement').oninput=e=>{const x=load(c,u);x.statement=e.target.value;save(c,u,x)};document.getElementById('nextPhotos').onclick=()=>nav('support',c,u);cameraInput.onchange=handleCameraChange}
function renderSupport(){const c=route.course,u=route.unit,d=load(c,u),t=unitTitle(c,u,c.units.indexOf(u)),pC=window.NAXOS4_PROMPTS.photo(mapping(u,'C'),t,'C'),pE=window.NAXOS4_PROMPTS.photo(mapping(u,'E'),t,'E'),qD=window.NAXOS4_PROMPTS.knowledge(mapping(u,'D'),t),qF=window.NAXOS4_PROMPTS.knowledge(mapping(u,'F'),t);setHeader(t,`${c.title} · Supporting evidence`);app.innerHTML=`<section class="page evidence-page"><div class="page-heading"><p class="step">STEP 2 OF 3</p><h2>Supporting evidence</h2><p>Complete each prompt using evidence from your own work.</p></div><div class="support-grid"><div class="support-item"><div class="support-criterion"><strong>Photo prompt</strong><p>${esc(pC)}</p></div><div class="support-photo-wrap"><button class="support-photo ${d.supportC?'has-photo':''}" data-support="C">${d.supportC?`<img src="${d.supportC}" alt="Supporting evidence"><span>Retake</span>`:`<strong>${esc(pC)}</strong><small>Tap to take photo</small>`}</button></div><label class="field-label" for="answerD">Knowledge question</label><p class="criterion-prompt">${esc(qD)}</p><textarea id="answerD" class="text-input" placeholder="Type your answer...">${esc(d.answerD||'')}</textarea></div><div class="support-item"><div class="support-criterion"><strong>Photo prompt</strong><p>${esc(pE)}</p></div><div class="support-photo-wrap"><button class="support-photo ${d.supportE?'has-photo':''}" data-support="E">${d.supportE?`<img src="${d.supportE}" alt="Supporting evidence"><span>Retake</span>`:`<strong>${esc(pE)}</strong><small>Tap to take photo</small>`}</button></div><label class="field-label" for="answerF">Knowledge question</label><p class="criterion-prompt">${esc(qF)}</p><textarea id="answerF" class="text-input" placeholder="Type your answer...">${esc(d.answerF||'')}</textarea></div></div><button id="nextSupport" class="primary">Next <span>›</span></button></section>`;document.querySelectorAll('.support-photo').forEach(x=>x.onclick=()=>{route.photo=x.dataset.support;cameraInput.value='';cameraInput.click()});document.getElementById('answerD').oninput=e=>{const x=load(c,u);x.answerD=e.target.value;save(c,u,x)};document.getElementById('answerF').oninput=e=>{const x=load(c,u);x.answerF=e.target.value;save(c,u,x)};document.getElementById('nextSupport').onclick=()=>nav('audio',c,u);cameraInput.onchange=handleCameraChange}
function handleCameraChange(){const file=cameraInput.files?.[0];if(!file)return;const target=route.photo;const reader=new FileReader();reader.onload=()=>{const c=route.course,u=route.unit,x=load(c,u);if(route.page==='photos'){x.photos=x.photos||[];x.photos[target]=reader.result;save(c,u,x);renderPhotos()}else if(route.page==='support'){x['support'+target]=reader.result;save(c,u,x);renderSupport()}};reader.readAsDataURL(file)}
let recorder=null,audioChunks=[];function renderAudio(){const c=route.course,u=route.unit,d=load(c,u),t=unitTitle(c,u,c.units.indexOf(u)),pg=window.NAXOS4_PROMPTS.audio(mapping(u,'G'),t),pr=window.NAXOS4_PROMPTS.reflection(mapping(u,'H'),t);setHeader(t,`${c.title} · Audio & reflection`);app.innerHTML=`<section class="page evidence-page"><div class="page-heading"><p class="step">STEP 3 OF 3</p><h2>Audio & reflection</h2><p>Answer the prompts in your own words.</p></div><div class="audio-card"><div class="criterion-prompt"><strong>Audio prompt</strong><p>${esc(pg)}</p></div><button id="record" class="record-button">● <span>${d.audio?'Record again':'Start recording'}</span></button><p id="recordStatus" class="record-status">${d.audio?'Audio answer saved.':'Recommended answer: about 30 seconds.'}</p><audio id="audioPlayback" controls ${d.audio?'':'hidden'} src="${d.audio||''}"></audio></div><div class="reflection"><div class="criterion-prompt"><strong>Reflection prompt</strong><p>${esc(pr)}</p></div><textarea id="reflection" class="text-input" placeholder="Write your reflection...">${esc(d.reflection||'')}</textarea></div><button id="finish" class="primary">Finish <span>✓</span></button></section>`;document.getElementById('reflection').oninput=e=>{const x=load(c,u);x.reflection=e.target.value;save(c,u,x)};document.getElementById('record').onclick=()=>startRecording(c,u);document.getElementById('finish').onclick=()=>{const x=load(c,u);x.finished=true;save(c,u,x);nav('units',c)}}
async function startRecording(c,u){const status=document.getElementById('recordStatus'),button=document.getElementById('record');if(recorder&&recorder.state==='recording'){recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)};recorder.onstart=()=>{button.classList.add('recording');button.querySelector('span').textContent='Stop recording';status.textContent='Recording... aim for about 30 seconds.'};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(audioChunks,{type:recorder.mimeType||'audio/webm'});const reader=new FileReader();reader.onload=()=>{const x=load(c,u);x.audio=reader.result;save(c,u,x);renderAudio()};reader.readAsDataURL(blob)};recorder.start()}catch(e){status.textContent='Microphone access was not available. Check your browser permissions.'}}
back.onclick=()=>{if(route.page==='units')nav('home');else if(route.page==='photos')nav('units',route.course);else if(route.page==='support')nav('photos',route.course,route.unit);else if(route.page==='audio')nav('support',route.course,route.unit)};render();window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install').hidden=false});document.getElementById('install').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('install').hidden=true};if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=20'));
</script></body></html>
