<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naxos 4</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>Naxos 4</h1><p>Course mapping</p></header>
<main id="app"></main>
<script src="courses.js"></script>
<script>
const app=document.getElementById('app');
const cols=[['A','6 Photos'],['B','Statement to column A'],['C','1 Photo'],['D','Statement to column C'],['E','Supporting Photo'],['F','Statement to column E'],['G','Audio recorded answer'],['H','Reflection from learner']];
function esc(v){return String(v).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]));}
function render(c){
  app.innerHTML=`<section class="courses">${window.NAXOS4_COURSES.map((x,i)=>`<button class="course ${i===0?'active':''}" data-i="${i}">${esc(x.title)}<small>${esc(x.standard)} v${esc(x.version)}</small></button>`).join('')}</section><section id="course"></section>`;
  const buttons=[...document.querySelectorAll('.course')];
  buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');show(window.NAXOS4_COURSES[Number(b.dataset.i)]);});
  show(c);
}
function show(c){document.getElementById('course').innerHTML=`<div class="title"><h2>${esc(c.title)}</h2><span>${esc(c.standard)} · v${esc(c.version)}</span></div><div class="table-wrap"><table><thead><tr><th>Unit</th>${cols.map(x=>`<th>${x[0]}<small>${x[1]}</small></th>`).join('')}</tr></thead><tbody>${c.units.map(u=>`<tr><th>${esc(u.unit)}</th>${['A','B','C','D','E','F','G','H'].map(k=>`<td>${esc(u[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
render(window.NAXOS4_COURSES[0]);
</script>
</body>
</html>
